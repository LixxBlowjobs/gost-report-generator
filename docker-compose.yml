version: '3.9'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - WEBHOOK_URL=http://localhost:5678/
      - FASTAPI_BASE_URL=http://fastapi:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - gost_net

  fastapi:
    build: ./fastapi
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - LLM_MODEL=google/gemma-3-27b-it
      - GOST_RULES_PATH=/app/data/gost_rules.json
      - JOB_STORAGE_DIR=/tmp/jobs
    volumes:
      - job_storage:/tmp/jobs
      - ./fastapi/data:/app/data
    restart: unless-stopped
    networks:
      - gost_net

volumes:
  n8n_data:
  job_storage:

networks:
  gost_net:
    driver: bridge
